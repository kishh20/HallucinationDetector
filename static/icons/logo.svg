<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .delta-mark { 
        fill: #FFFFFF; 
      }
      .brand-title {
        font-family: 'Rajdhani', 'Orbitron', 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 7px;
        fill: #FFFFFF;
      }
      .brand-sub {
        font-family: 'Rajdhani', 'Orbitron', 'Inter', -apple-system, sans-serif;
        font-weight: 600;
        letter-spacing: 12px;
        font-size: 14px;
        fill: #737373;
      }
    </style>
  </defs>

  <!-- Deep Black Minimalist Canvas -->
  <rect width="500" height="500" fill="#000000" />

  <!-- Geometric Delta Emblem with Signature Slash Gap -->
  <g id="delta-logo">
    <!-- Left Angled Pillar (Floating slash) -->
    <path class="delta-mark" d="M 233,97 
                              L 126,297 
                              L 165,297 
                              L 253,133 
                              Z" />

    <!-- Right Hook Loop (Rounded apex curving down and wrapping inward) -->
    <path class="delta-mark" d="M 247,85
                              C 255,85 262,89 266,97
                              L 374,297
                              L 226,297
                              L 245,261
                              L 332,261
                              L 257,121
                              L 242,149
                              L 223,113
                              C 229,95 238,85 247,85
                              Z" />
  </g>

  <!-- Brand Typography -->
  <text x="254" y="375" text-anchor="middle" class="brand-title">HALLUCINATION</text>
  <text x="257" y="410" text-anchor="middle" class="brand-sub">DETECTOR</text>
</svg>
