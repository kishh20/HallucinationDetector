<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veritas AI — Sign In & Register</title>
  <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0a0b0e;
      --card-glass: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.14);
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      --text-dim: rgba(255, 255, 255, 0.45);
      --line-border: rgba(255, 255, 255, 0.18);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
      overflow-x: hidden;
      position: relative;
    }

    /* 3D Dark Faceted Geometric Background (Exact Video Match) */
    .faceted-bg-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #0b0c10;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(30, 32, 40, 0.2) 0%, rgba(10, 11, 15, 0.85) 85%),
        url('/static/procedural_faceted_bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Dark vignette overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
    }

    /* Main Floating Split-Pane Glass Card */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 820px;
      padding: 1rem;
    }

    .glass-split-card {
      display: flex;
      width: 100%;
      min-height: 480px;
      background: rgba(22, 23, 29, 0.55);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 
        0 40px 90px -15px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 1px 2px rgba(255, 255, 255, 0.22);
      overflow: hidden;
      position: relative;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Left Panel: Hero Welcome Panel with Angled Glass Divider */
    .panel-left {
      flex: 0 0 42%;
      background: rgba(16, 17, 22, 0.45);
      border-right: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 3.6rem 2.8rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      clip-path: polygon(0 0, 96% 0, 100% 100%, 0 100%);
      transition: all 0.35s ease;
    }

    .hero-heading {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 1.1rem;
    }

    .hero-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 2.2rem;
      max-width: 250px;
    }

    .btn-hero-outline {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      color: #ffffff;
      border-radius: 9999px;
      padding: 0.65rem 1.6rem;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      align-self: flex-start;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .btn-hero-outline:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.65);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Right Panel: Form Fields */
    .panel-right {
      flex: 1;
      background: rgba(22, 23, 30, 0.38);
      padding: 3.6rem 3.4rem 3.2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      transition: all 0.35s ease;
    }

    .form-title {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 2.2rem;
    }

    /* Error Banner */
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 0.65rem 0.9rem;
      border-radius: 12px;
      font-size: 0.84rem;
      margin-bottom: 1.4rem;
    }

    /* Clean Underline Input Groups */
    .input-row {
      position: relative;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 0.2rem;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .underline-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line-border);
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      padding: 0.8rem 2.2rem 0.8rem 2.2rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .underline-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
      font-size: 0.92rem;
    }

    .underline-input:focus {
      border-bottom-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .eye-toggle-btn {
      position: absolute;
      right: 0.2rem;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .eye-toggle-btn:hover {
      color: #ffffff;
    }

    /* Sign Up / Sign In Frosted Pill Button */
    .btn-submit-pill {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border-radius: 9999px;
      padding: 0.85rem 1.8rem;
      font-size: 0.96rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.4rem;
      margin-bottom: 1.4rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }

    .btn-submit-pill:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .btn-submit-pill:active {
      transform: translateY(0);
    }

    /* Footer Text */
    .form-footer {
      text-align: center;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .footer-toggle-link {
      color: #ffffff;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      margin-left: 0.25rem;
      transition: color 0.15s ease;
    }

    .footer-toggle-link:hover {
      color: #f97316;
    }

    /* Additional Options / Guest Link */
    .card-extra-options {
      margin-top: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .guest-link {
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .guest-link:hover {
      color: #ffffff;
    }

    /* Toast */
    .toast-popup {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 19, 26, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 0.75rem 1.4rem;
      border-radius: 14px;
      font-size: 0.88rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .toast-popup.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .glass-split-card {
        flex-direction: column;
      }
      .panel-left {
        clip-path: none;
        border-right: none;
        border-bottom: 1.5px solid rgba(255, 255, 255, 0.12);
        padding: 2.5rem 2rem;
      }
      .panel-right {
        padding: 2.5rem 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Faceted 3D Background & Vignette -->
  <div class="faceted-bg-stage"></div>
  <div class="vignette-overlay"></div>

  <!-- Main Floating Split-Pane Glass Card -->
  <div class="card-container">
    <div class="glass-split-card">
      
      <!-- Left Panel: Hero Switcher -->
      <div class="panel-left" id="panelLeft">
        <h2 class="hero-heading" id="heroHeading">WELCOME<br>BACK!</h2>
        <p class="hero-desc" id="heroDesc">Already a Member? Please Login with your credentials.</p>
        <button type="button" class="btn-hero-outline" id="heroActionBtn" onclick="toggleMode()">
          <span id="heroBtnText">Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <!-- Right Panel: Form Fields -->
      <div class="panel-right" id="panelRight">
        <h2 class="form-title" id="formTitle">Create Account</h2>

        <div class="error-banner" id="errorBanner"></div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)">
          
          <!-- Full Name / Username Field -->
          <div class="input-row" id="nameRow">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <input 
              type="text" 
              class="underline-input" 
              id="usernameInput" 
              placeholder="Full Name" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>

          <!-- Work Email Field (In Signup mode) -->
          <div class="input-row" id="emailRow">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <input 
              type="email" 
              class="underline-input" 
              id="emailInput" 
              placeholder="Work Email" 
              autocomplete="email"
            >
          </div>

          <!-- Password Field -->
          <div class="input-row">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input 
              type="password" 
              class="underline-input" 
              id="passwordInput" 
              placeholder="Create Password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="eye-toggle-btn" id="eyeToggleBtn" onclick="togglePasswordVisibility()" title="Show/Hide password">
              <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <!-- Submit Pill Button -->
          <button type="submit" class="btn-submit-pill" id="submitBtn">
            <span id="submitBtnText">Sign Up</span>
          </button>

          <!-- Footer Prompt -->
          <div class="form-footer">
            <span id="footerPrompt">Already a Member?</span>
            <span class="footer-toggle-link" id="footerLink" onclick="toggleMode()">Login</span>
          </div>

        </form>

        <!-- Guest Link Option -->
        <div class="card-extra-options">
          <span class="guest-link" onclick="continueAsGuest()">Continue as Guest &rarr;</span>
        </div>

      </div>

    </div>
  </div>

  <!-- Toast Popup -->
  <div class="toast-popup" id="toastPopup">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Notification message</span>
  </div>

  <script>
    // Initial state matches the video: "Create Account" on right, "WELCOME BACK!" on left
    let currentMode = "signup";

    function setMode(mode) {
      currentMode = mode;
      const heroHeading = document.getElementById("heroHeading");
      const heroDesc = document.getElementById("heroDesc");
      const heroBtnText = document.getElementById("heroBtnText");
      const formTitle = document.getElementById("formTitle");
      const usernameInput = document.getElementById("usernameInput");
      const emailRow = document.getElementById("emailRow");
      const passwordInput = document.getElementById("passwordInput");
      const submitBtnText = document.getElementById("submitBtnText");
      const footerPrompt = document.getElementById("footerPrompt");
      const footerLink = document.getElementById("footerLink");
      const errorBanner = document.getElementById("errorBanner");
      errorBanner.style.display = "none";

      if (mode === "signup") {
        // Video default view
        heroHeading.innerHTML = "WELCOME<br>BACK!";
        heroDesc.textContent = "Already a Member? Please Login with your credentials.";
        heroBtnText.textContent = "Sign In";
        formTitle.textContent = "Create Account";
        usernameInput.placeholder = "Full Name";
        emailRow.style.display = "flex";
        passwordInput.placeholder = "Create Password";
        submitBtnText.textContent = "Sign Up";
        footerPrompt.textContent = "Already a Member?";
        footerLink.textContent = "Login";
      } else {
        // Sign In view
        heroHeading.innerHTML = "HELLO,<br>FRIEND!";
        heroDesc.textContent = "Don't have an account yet? Register and start verifying with us.";
        heroBtnText.textContent = "Sign Up";
        formTitle.textContent = "Sign In";
        usernameInput.placeholder = "Username or Email";
        emailRow.style.display = "none";
        passwordInput.placeholder = "Password";
        submitBtnText.textContent = "Sign In";
        footerPrompt.textContent = "Don't have an account?";
        footerLink.textContent = "Sign Up";
      }
    }

    function toggleMode() {
      setMode(currentMode === "signup" ? "signin" : "signup");
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById("passwordInput");
      const eyeIcon = document.getElementById("eyeIcon");
      if (pass.type === "password") {
        pass.type = "text";
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        pass.type = "password";
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    function showToast(msg, icon = "✨") {
      const toast = document.getElementById("toastPopup");
      document.getElementById("toastIcon").textContent = icon;
      document.getElementById("toastMsg").textContent = msg;
      toast.classList.add("visible");
      setTimeout(() => {
        toast.classList.remove("visible");
      }, 3500);
    }

    function continueAsGuest() {
      window.location.href = "/";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const errorBanner = document.getElementById("errorBanner");
      const submitBtn = document.getElementById("submitBtn");
      const submitBtnText = document.getElementById("submitBtnText");

      errorBanner.style.display = "none";
      const originalText = submitBtnText.textContent;
      submitBtn.disabled = true;
      submitBtnText.textContent = "Processing...";

      const endpoint = currentMode === "signup" ? "/api/auth/register" : "/api/auth/login";

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorBanner.textContent = data.detail || "Authentication failed. Please verify credentials.";
          errorBanner.style.display = "block";
          submitBtn.disabled = false;
          submitBtnText.textContent = originalText;
          return;
        }

        showToast("Authenticated successfully! Entering Veritas...", "🚀");
        setTimeout(() => {
          window.location.href = "/";
        }, 500);
      } catch (err) {
        errorBanner.textContent = "Network error connecting to Veritas backend. Please try again.";
        errorBanner.style.display = "block";
        submitBtn.disabled = false;
        submitBtnText.textContent = originalText;
      }
    }
  </script>
</body>
</html>
